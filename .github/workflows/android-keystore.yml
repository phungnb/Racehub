name: Android — tạo khóa ký (chạy 1 lần)

# Tạo khóa ký (upload key) cho Google Play mà không cần máy tính.
# Trước khi chạy: Settings → Secrets and variables → Actions → New repository secret
#   ANDROID_KEYSTORE_PASSWORD = mật khẩu mạnh do bạn tự đặt (≥ 12 ký tự, cất kỹ).
# Sau khi chạy: tải artifact "racehub-keystore" (giữ 1 ngày) → mở file keystore-base64.txt → chép toàn bộ nội dung
# vào secret mới ANDROID_KEYSTORE_BASE64 → XOÁ lần chạy này (để xoá artifact). Cất file .jks ở nơi an toàn (Google Drive cá nhân…).
# Khóa luôn được bảo vệ bằng mật khẩu ở trên; nên để repo ở chế độ Private.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ TAO-KHOA để xác nhận (chỉ làm 1 lần — tạo lại sẽ ra khóa khác)'
        required: true

jobs:
  keystore:
    if: ${{ inputs.confirm == 'TAO-KHOA' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tạo khóa
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ] || [ ${#PW} -lt 12 ]; then echo "::error::Chưa có secret ANDROID_KEYSTORE_PASSWORD (≥ 12 ký tự)"; exit 1; fi
          mkdir out
          keytool -genkeypair -v -storetype PKCS12 -keystore out/racehub-release.jks -alias racehub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=RaceHub, O=RaceHub, C=VN"
          base64 -w0 out/racehub-release.jks > out/keystore-base64.txt
          keytool -list -v -keystore out/racehub-release.jks -storepass "$PW" | grep -E "SHA1|SHA256" > out/fingerprint.txt
      - uses: actions/upload-artifact@v4
        with:
          name: racehub-keystore
          path: out/
          retention-days: 1
